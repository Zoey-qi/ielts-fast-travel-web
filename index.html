<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FBF6F0">
<meta name="color-scheme" content="light">
<title>雅思快穿 · 中英对照阅读</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ===== 顶部导航 ===== -->
<header class="app-header">
  <div class="header-inner">
    <span class="brand">✦ 雅思快穿</span>
    <div class="header-actions">
      <button class="icon-btn" id="btnBook" title="词汇书">📖</button>
    </div>
  </div>
  <div class="mode-toggle" id="modeToggle" hidden>
    <button class="mode-btn active" data-mode="full">全英文</button>
    <button class="mode-btn" data-mode="blanks">挖空</button>
  </div>
</header>

<!-- ===== 主容器 ===== -->
<main id="app">

  <!-- 书架视图 -->
  <section id="view-bookshelf" class="view active">
    <div class="hero">
      <div class="hero-title serif">Starlight Rebirth</div>
      <div class="hero-sub">女频快穿 · 雅思学习爽文</div>
      <div class="hero-stats">
        <span id="statChapters">5 章</span> · <span id="statWords">7306 词</span> · <span id="statFav">0 收藏</span>
      </div>
    </div>
    <div id="chapterList" class="chapter-list"></div>
  </section>

  <!-- 阅读视图（内置书） -->
  <section id="view-reader" class="view">
    <div id="readerHeader" class="reader-header"></div>
    <div id="readerBody" class="reader-body"></div>
    <div id="readerFooter" class="reader-footer"></div>
  </section>

  <!-- 阅读视图（PDF 导入书） -->
  <section id="view-pdfreader" class="view">
    <div id="pdfHeader" class="reader-header"></div>
    <div id="pdfBody" class="reader-body"></div>
    <div id="pdfFooter" class="reader-footer"></div>
  </section>

  <!-- 生词本视图 -->
  <section id="view-vocab" class="view">
    <div class="view-head">
      <h2>生词本</h2>
      <span id="favCount" class="badge">0</span>
    </div>
    <div class="filter-row" id="favFilter"></div>
    <div id="favList" class="fav-list"></div>
  </section>

  <!-- 词汇书视图 -->
  <section id="view-wordbook" class="view">
    <div class="view-head">
      <h2>雅思词汇书</h2>
      <span id="wbCount" class="badge">—</span>
    </div>
    <div class="search-row">
      <input type="search" id="wbSearch" placeholder="搜索单词 / 中文释义…" autocomplete="off">
      <button id="wbSearchBtn" class="btn-primary">搜索</button>
    </div>
    <div class="cefr-filter" id="cefrFilter"></div>
    <div id="wordbookList" class="wordbook-list"></div>
    <div id="wbLoadMore" class="load-more"></div>
  </section>

  <!-- 我的视图 -->
  <section id="view-mine" class="view">
    <div class="mine-card">
      <h3>学习统计</h3>
      <div class="stats-grid">
        <div class="stat"><span id="mFav">0</span><label>收藏单词</label></div>
        <div class="stat"><span id="mQuiz">0</span><label>测试次数</label></div>
        <div class="stat"><span id="mBest">—</span><label>最佳成绩</label></div>
        <div class="stat"><span id="mChapter">1</span><label>当前章节</label></div>
      </div>
    </div>
    <div class="mine-card">
      <h3>阅读模式</h3>
      <div class="setting-row">
        <label>默认挖空显示</label>
        <button id="modeDefault" class="btn-ghost">当前：全英文</button>
      </div>
      <div class="setting-row">
        <label>PDF 自动挖空难度</label>
        <div class="level-row" id="levelRow">
          <button class="chip" data-lv="A2">基础<br><small>A2+</small></button>
          <button class="chip" data-lv="B1">标准<br><small>B1+</small></button>
          <button class="chip" data-lv="B2">进阶<br><small>B2+</small></button>
        </div>
      </div>
      <p class="note">基础：挖 A2 及以上词（偏多）；进阶：只挖 B2 及以上（偏少精）。导入新书时生效。</p>
    </div>
    <div class="mine-card">
      <h3>数据说明</h3>
      <p class="note">词库来源：<a href="https://github.com/designfuchen/word-atlas" target="_blank" rel="noopener">词光 Word Atlas</a>（CC BY 4.0）· 7,298 个雅思核心词，CEFR A1–C2 分级。收藏与进度保存在本设备浏览器中。</p>
      <button id="btnReset" class="btn-ghost danger">清空本地数据</button>
    </div>
  </section>

</main>

<!-- ===== 底部 Tab ===== -->
<nav class="tabbar">
  <button class="tab active" data-tab="bookshelf"><span class="tab-icon">📚</span><span>书架</span></button>
  <button class="tab" data-tab="vocab"><span class="tab-icon">⭐</span><span>生词本</span></button>
  <button class="tab" data-tab="wordbook"><span class="tab-icon">📖</span><span>词汇书</span></button>
  <button class="tab" data-tab="mine"><span class="tab-icon">👤</span><span>我的</span></button>
</nav>

<!-- ===== 单词释义弹层 ===== -->
<div id="wordModal" class="modal-mask" hidden>
  <div class="modal-card">
    <div class="modal-head">
      <span id="modalWord" class="modal-word serif"></span>
      <button id="modalSpeak" class="modal-speak" title="朗读发音">🔊</button>
      <button id="modalClose" class="modal-close">✕</button>
    </div>
    <div id="modalPhonetic" class="modal-phonetic"></div>
    <div id="modalSenses" class="modal-senses"></div>
    <div id="modalExtra"></div>
    <button id="modalFav" class="btn-primary modal-fav">⭐ 收藏</button>
  </div>
</div>

<!-- ===== 词库覆盖率弹层 ===== -->
<div id="coverageModal" class="modal-mask" hidden>
  <div class="modal-card coverage-card">
    <div class="modal-head">
      <span class="modal-word serif">词库覆盖率</span>
      <button id="coverageClose" class="modal-close">✕</button>
    </div>
    <div id="coverageBody"></div>
  </div>
</div>

<!-- ===== 测试弹层 ===== -->
<div id="quizModal" class="modal-mask" hidden>
  <div class="modal-card quiz-card">
    <div class="quiz-head">
      <span id="quizTitle"></span>
      <span id="quizProgress" class="badge"></span>
      <button id="quizClose" class="modal-close">✕</button>
    </div>
    <div id="quizBody"></div>
  </div>
</div>

<script src="data/jszip.min.js"></script>
<script src="data/pdf.min.js"></script>
<script src="lexer.js"></script>

<!-- ===== 启动加载遮罩（大文件异步加载，失败可重试/跳过） ===== -->
<div id="bootMask" class="boot-mask">
  <div class="boot-card">
    <div class="boot-spinner"></div>
    <div id="bootText">正在加载雅思词库（约 2MB）…</div>
    <div class="boot-actions">
      <button id="bootRetry" class="btn-primary boot-retry" style="display:none" onclick="window.__bootRetry && window.__bootRetry()">重试</button>
      <button id="bootSkip" class="btn-ghost boot-skip" onclick="window.__bootSkip && window.__bootSkip()">跳过，直接进入（词库后台继续加载）</button>
    </div>
  </div>
</div>

<script>
/* 引导加载器：words.js(6.3MB) / jiushizhu.js(1MB) 异步加载，
   不阻塞首屏；任何一步失败显示重试，而非让整个 app 崩溃 */
(function () {
  var deps = ['data/words.js', 'data/jiushizhu.js', 'app.js'];
  var texts = {
    'data/words.js': '正在加载雅思词库（约 2MB）…',
    'data/jiushizhu.js': '正在加载内置小说《遥远的救世主》…',
    'app.js': '正在启动…'
  };
  var mask = document.getElementById('bootMask');
  var txt = document.getElementById('bootText');
  var retry = document.getElementById('bootRetry');
  var skipBtn = document.getElementById('bootSkip');
  var loaded = {};
  var failed = [];
  var booting = false;
  var skipped = false;
  var bootTimer = null;

  function setText(t) { if (txt) txt.textContent = t; }
  function setLoading(on) {
    if (retry) retry.style.display = (on || !failed.length) ? 'none' : 'inline-block';
    if (mask) mask.style.display = on ? 'flex' : 'none';
  }
  function hideMask() {
    if (mask) mask.style.display = 'none';
    if (bootTimer) { clearTimeout(bootTimer); bootTimer = null; }
  }
  // 逃生：跳过加载，直接进入应用（词库仍在后台加载，加载完自动就绪）
  function bootSkip() {
    if (skipped) return;
    skipped = true;
    hideMask();
    if (retry) retry.style.display = 'none';
    // 后台继续加载缺失项
    if (!window.__APP_READY) {
      var todo = deps.filter(function (s) { return !loaded[s] && (s !== 'app.js' || !window.__APP_READY); });
      todo.forEach(function (src) {
        loadScript(src).then(function () {
          if (src === 'data/words.js' && window.__ensureWords) { try { window.__ensureWords(); } catch (e) {} }
        }, function () { /* 后台加载失败不打扰，用户可稍后刷新 */ });
      });
    }
    toast_ish('词库加载中，稍后可查看词汇书');
  }
  function toast_ish(msg) {
    try { if (window.__toast) window.__toast(msg); } catch (e) { /* 忽略 */ }
  }
  function loadScript(src) {
    return new Promise(function (res, rej) {
      var s = document.createElement('script');
      s.src = src; s.async = false;
      s.onload = function () { loaded[src] = true; res(); };
      s.onerror = function () { rej(new Error(src)); };
      document.head.appendChild(s);
    });
  }
  function boot() {
    if (booting) return;
    booting = true;
    setLoading(true);
    // 只加载缺失项；app.js 已执行过则跳过（避免重复绑事件）
    var todo = deps.filter(function (s) {
      if (loaded[s]) return false;
      if (s === 'app.js') return !window.__APP_READY;
      return true;
    });
    // 超时自动跳过：20 秒仍未就绪则直接进入应用（词库后台继续）
    if (bootTimer) clearTimeout(bootTimer);
    bootTimer = setTimeout(function () {
      if (!window.__APP_READY && !skipped) bootSkip();
    }, 20000);
    var idx = 0;
    (function next() {
      if (idx >= todo.length) {
        booting = false;
        if (bootTimer) { clearTimeout(bootTimer); bootTimer = null; }
        // words.js 已加载但 app.js 未跑 → 补建索引；若都已就绪则直接收尾
        if (window.IELTS_WORDS && window.__ensureWords) window.__ensureWords();
        // 全部就绪 → 等 app 初始化
        var t = setInterval(function () {
          if (window.__APP_READY) { clearInterval(t); setLoading(false); }
        }, 60);
        return;
      }
      var src = todo[idx++];
      setText(texts[src] || '加载中…');
      loadScript(src).then(function () {
        // words.js 刚加载完 → 立即重建词库索引（app.js 若未运行，由 __APP_READY 收尾）
        if (src === 'data/words.js') {
          try {
            if (window.__ensureWords) window.__ensureWords();
          } catch (e) { /* 忽略 */ }
        }
        next();
      }, function () {
        failed = [src];
        booting = false;
        if (bootTimer) { clearTimeout(bootTimer); bootTimer = null; }
        setText('加载失败：' + src.split('/').pop() + '（网络不稳定，可能是 GitHub Pages 访问问题）。可点击重试，或跳过直接进入。');
        setLoading(false);
      });
    })();
  }
  window.__bootRetry = boot;
  window.__bootSkip = bootSkip;
  boot();
})();
</script>
</body>
</html>
